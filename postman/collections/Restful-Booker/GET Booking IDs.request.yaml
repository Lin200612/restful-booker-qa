$kind: http-request
description: ""
url: https://restful-booker.herokuapp.com/booking
method: GET
scripts:
  - type: afterResponse
    code: "pm.test(\"Status is 200\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test(\"Response is a non-empty array\", function () {\r

      \    const data = pm.response.json();\r

      \    pm.expect(data).to.be.an(\"array\").that.is.not.empty;\r

      });\r

      \r

      pm.test(\"Each item has bookingid\", function () {\r

      \    pm.response.json().forEach(function (item) {\r

      \        pm.expect(item).to.have.property(\"bookingid\");\r

      \    });\r

      });"
    language: text/javascript
order: 1000
