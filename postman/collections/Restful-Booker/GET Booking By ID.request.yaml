$kind: http-request
description: ""
url: https://restful-booker.herokuapp.com/booking/{{bookingId}}
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));

      pm.test("Booking data is correct", () => {
          const data = pm.response.json();
          pm.expect(data.firstname).to.eql("Ivan");
          pm.expect(data.lastname).to.eql("Tester");
      });
    language: text/javascript
order: 5000
