$kind: http-request
description: ""
url: https://restful-booker.herokuapp.com/booking/{{bookingId}}
method: PUT
body:
  type: json
  content: "{\r

    \    \"firstname\": \"Petr\",\r

    \    \"lastname\": \"Tester\",\r

    \    \"totalprice\": 200,\r

    \    \"depositpaid\": true,\r

    \    \"bookingdates\": {\r

    \        \"checkin\": \"2026-12-01\",\r

    \        \"checkout\": \"2026-12-05\"\r

    \    },\r

    \    \"additionalneeds\": \"Breakfast\"\r

    }"
auth:
  type: basic
  credentials:
    username: admin
    password: password123
scripts:
  - type: afterResponse
    code: "pm.test(\"Status is 200\", () => pm.response.to.have.status(200));\r

      \r

      pm.test(\"Booking is updated\", () => {\r

      \    const data = pm.response.json();\r

      \    pm.expect(data.firstname).to.eql(\"Petr\");\r

      \    pm.expect(data.totalprice).to.eql(200);\r

      });"
    language: text/javascript
order: 6000
